# Optional: regenerate LumaRemote.xcodeproj with XcodeGen (`brew install xcodegen && xcodegen`).
name: LumaRemote
options:
  bundleIdPrefix: com.lumaremote
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  LumaRemote:
    type: application
    platform: iOS
    sources: [LumaRemote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumaremote.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Luma Remote
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  LumaRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LumaRemoteTests]
    dependencies:
      - target: LumaRemote
